name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: platform

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: interview }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      redis:
        image: valkey/valkey:9.1
        ports: ["6380:6379"]
    env:
      DATABASE_URL: postgres://app_user:ci_password@localhost:5433/interview
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5433/interview
      REDIS_URL: redis://localhost:6380
      APP_URL: http://localhost:3001
      DATA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      # scripts use --env-file=.env.local; CI passes settings through the environment instead
      - run: touch .env.local && npm run migrate
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
