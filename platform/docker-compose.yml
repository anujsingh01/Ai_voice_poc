# Local stand-ins for the AWS services: Postgres (RDS), Valkey (ElastiCache), and S3Mock for S3
# (only with `docker compose --profile s3 up -d`, to test STORAGE_DRIVER=s3 locally).
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview
    ports: ["5433:5432"]
    volumes: [pgdata18:/var/lib/postgresql]   # Postgres 18 images keep data under /var/lib/postgresql/18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  redis:                      # Valkey: the open-source Redis successor ElastiCache runs
    image: valkey/valkey:9.1
    ports: ["6380:6379"]

  s3mock:
    image: adobe/s3mock:4.7.0
    profiles: [s3]
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: interview-audio-test
    ports: ["9100:9090"]

volumes:
  pgdata18:
