# Single-VM deployment (Azure Ubuntu VM). Replaces the AWS Terraform stack for the POC.
# Runs: caddy (HTTPS) -> web, plus scoring/maintenance/message workers, Postgres and Valkey.
# Used from /opt/ai-voice on the VM by .github/workflows/deploy.yml; env comes from /opt/ai-voice/.env.

x-app-env: &app-env
  APP_ENV: staging                 # "production" would force S3 + RDS SSL (AWS-only checks in src/lib/env.ts)
  APP_URL: https://${DOMAIN}
  DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/interview
  DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/interview
  REDIS_URL: redis://redis:6379
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
  HEALTH_TOKEN: ${HEALTH_TOKEN}
  STORAGE_DRIVER: local
  STORAGE_DIR: /data/storage
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
  SCORING_PROVIDER: ${SCORING_PROVIDER:-}
  EMAIL_DRIVER: ${EMAIL_DRIVER:-}
  SMS_DRIVER: ${SMS_DRIVER:-}
  BILLING_DRIVER: ${BILLING_DRIVER:-}

x-job: &job
  image: ghcr.io/${GHCR_OWNER}/ai-voice-jobs:${IMAGE_TAG:-latest}
  restart: unless-stopped
  environment: *app-env
  volumes: [storage:/data/storage]
  depends_on:
    migrate: { condition: service_completed_successfully }

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: interview
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30

  redis:
    image: valkey/valkey:9.1
    restart: unless-stopped
    volumes: [redisdata:/data]

  migrate:
    image: ghcr.io/${GHCR_OWNER}/ai-voice-jobs:${IMAGE_TAG:-latest}
    command: ["scripts/migrate.mts"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    image: ghcr.io/${GHCR_OWNER}/ai-voice-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment: *app-env
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_started }

  scoring-worker:
    <<: *job
    command: ["scripts/scoring-worker.mts"]

  maintenance-worker:
    <<: *job
    command: ["scripts/maintenance-worker.mts"]

  message-worker:
    <<: *job
    command: ["scripts/message-worker.mts"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
